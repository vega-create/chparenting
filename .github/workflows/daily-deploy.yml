name: Daily Deploy
on:
  schedule:
    - cron: '30 0 * * *'
  # Auto-deploy on every push to main so content edits ship immediately
  # (otherwise pushes wait until the next 08:30 Taiwan cron tick).
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 讓 IndexNow 腳本能 diff 上一個 commit 改到的文章
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=chparenting
      - name: IndexNow submit (Bing / Yahoo)
        # 剛上線或剛更新的文章即時送進 Bing 系索引；失敗不擋部署
        run: node scripts/indexnow-submit.mjs
        continue-on-error: true
